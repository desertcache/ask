<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Ask about my work · Samuel Bates</title>
  <meta name="description" content="Ask about Sam Bates's work. A 3.9 MB model runs on your device and finds the answer Sam approved; nothing is generated and nothing leaves your browser.">
  <meta name="theme-color" content="#150f24">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23ff7a45'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap">
  <link rel="stylesheet" href="css/ask.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="chat">
    <header class="head">
      <span class="avatar" aria-hidden="true"></span>
      <div class="head-text">
        <h1 class="title">Ask about my work</h1>
        <p class="sub"><span class="dot" aria-hidden="true"></span><span class="sub-text">On-device · 3.9 MB · private</span></p>
      </div>
    </header>

    <div id="log" class="log" role="log" aria-live="polite" aria-label="Conversation"></div>

    <form id="ask" class="ask" autocomplete="off">
      <label class="sr-only" for="q">Your question about Sam's work</label>
      <input id="q" name="q" type="text" maxlength="200" placeholder="Ask about Sam's work…" enterkeyhint="send">
      <button id="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m0 0-6 6m6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
    <p class="how">Answers are ones Sam approved; nothing is generated, and your question never leaves your browser. <a href="https://github.com/desertcache/ask" target="_blank" rel="noopener">How it works <span aria-hidden="true">↗</span></a></p>
  </main>
</body>
</html>
