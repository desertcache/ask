<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask about my work · Samuel Bates</title>
  <meta name="description" content="Ask about Sam Bates's work. A 3.9 MB model runs on your device and finds the answer Sam approved; nothing is generated and nothing leaves your browser.">
  <meta name="theme-color" content="#150f24">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23ff7a45'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap">
  <link rel="stylesheet" href="css/ask.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="box">
    <header class="head">
      <p class="eyebrow"><span class="dot" aria-hidden="true"></span>On-device · 3.9 MB</p>
      <h1 class="title">Ask about my work</h1>
    </header>

    <form id="ask" class="ask" role="search" autocomplete="off">
      <label class="sr-only" for="q">Your question about Sam's work</label>
      <input id="q" name="q" type="text" maxlength="200" placeholder="Can he code? What has he shipped?" enterkeyhint="search">
      <button type="submit">Ask</button>
    </form>
    <p id="status" class="status" role="status">Loading…</p>

    <section id="result" class="result" aria-live="polite"></section>

    <div class="chips-wrap">
      <p id="chips-label" class="chips-label"></p>
      <div id="chips" class="chips"></div>
    </div>

    <footer class="foot">
      <p id="meta" class="meta"></p>
      <p class="how">A small model matches your question to answers Sam approved. It doesn't generate text, so it can't make anything up. <a href="https://github.com/desertcache/ask" target="_blank" rel="noopener">Source <span aria-hidden="true">↗</span></a></p>
    </footer>
  </main>
</body>
</html>
